[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
hadrian = "https://hadrian.testnet.romeprotocol.xyz/"
rubicon = "https://rubicon.mainnet.romeprotocol.xyz/"

[etherscan]
hadrian = { key = "empty", url = "https://via-hadrian.testnet.romeprotocol.xyz/api" }
rubicon = { key = "empty", url = "https://via.mainnet.romeprotocol.xyz/api" }
